name: Helm Lint and Test

on:
  pull_request:
    paths:
      - 'helm/**'
  push:
    branches: [main]
    paths:
      - 'helm/**'

jobs:
  lint:
    name: Lint Chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Helm is not available in the default Act image, so we only install it when running locally
      - name: Install Helm
        if: ${{ env.ACT == 'true' }}
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5

      - name: helm lint
        working-directory: helm
        run: helm lint .

      - name: helm dependency list
        working-directory: helm
        run: helm dependency list . || true

  template:
    name: Template Smoke Tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        scenario:
          - name: default
            args: ""
          - name: full-turbo
            args: >
              --set ingress.enabled=true
              --set autoscaling.enabled=true
              --set autoscaling.minReplicas=2
              --set autoscaling.maxReplicas=10
              --set networkPolicy.enabled=true
              --set serviceAccount.create=true
              --set pdb.enabled=true
          - name: resource-bump
            args: >
              --set resources.requests.cpu=512m
              --set resources.requests.memory=512Mi
              --set resources.limits.cpu=1
              --set resources.limits.memory=1Gi
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Helm is not available in the default Act image, so we only install it when running locally
      - name: Install Helm
        if: ${{ env.ACT == 'true' }}
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5

      - name: helm template (${{ matrix.scenario.name }})
        working-directory: helm
        run: |
          echo "=== Scenario: ${{ matrix.scenario.name }} ==="
          helm template test-release . ${{ matrix.scenario.args }} > /dev/null 2>&1
          echo "Template rendered successfully"

  kubeconform:
    name: Validate against Kubernetes Schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Helm is not available in the default Act image, so we only install it when running locally
      - name: Install Helm
        if: ${{ env.ACT == 'true' }}
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5

      - name: Install Kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render and validate
        working-directory: helm
        run: |
          helm template test-release . \
            | kubeconform \
              --kubernetes-version 1.34.0 \
              --strict \
              --ignore-missing-schemas \
              --schema-location default \
              --output json \
              -summary
