{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deployment-app.fullname" . }}
  labels:
    {{- include "deployment-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "deployment-app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from the ingress controller
    - ports:
        - port: {{ .Values.service.port }}
      from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressControllerLabels | nindent 18 }}
    {{- if .Values.networkPolicy.allowHealthCheckFromAnywhere }}
    # Allow health check probes from the kubelet (namespace-agnostic)
    - ports:
        - port: {{ .Values.service.port }}
      from:
        - ipBlock:
            cidr: 0.0.0.0/0
    {{- end }}
    {{- with .Values.networkPolicy.extraIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
